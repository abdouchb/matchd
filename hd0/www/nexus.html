<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Browser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --glass-bg: rgba(20, 20, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.1);
            --accent: #8b5cf6;
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: white;
            padding: 12px;
            gap: 12px;
        }

        /* Custom Scrollbar for dark theme */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-button {
            transition: all 0.2s ease;
        }
        .glass-button:hover {
            background: var(--glass-hover);
            transform: translateY(-1px);
        }
        .glass-button:active {
            transform: translateY(1px);
        }

        /* Vertical Tabs */
        .v-tab {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }
        .v-tab.active {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: inset 4px 0 0 0 var(--accent);
        }

        /* Viewport Container */
        #viewport-container {
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            flex-grow: 1;
            background: #ffffff; /* Webpages need white background by default */
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            transition: opacity 0.3s ease;
        }

        /* Floating Omnibox */
        .omnibox {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            width: 90%;
            max-width: 700px;
            transition: all 0.3s ease;
        }
        .omnibox:focus-within {
            width: 95%;
            max-width: 800px;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5), 0 0 0 1px rgba(139, 92, 246, 0.5);
        }

        .loading-ring {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Loader Overlay */
        #loader-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(5px);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #loader-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="w-64 glass-panel rounded-3xl flex flex-col relative z-20 flex-shrink-0">
        <!-- Logo / App Header -->
        <div class="p-6 flex items-center gap-3 border-b border-white/10">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-500 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
                <i class="fas fa-satellite text-white text-sm"></i>
            </div>
            <h1 class="font-semibold text-lg tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">Nexus</h1>
        </div>

        <!-- Bookmarks Quick Access (Top) -->
        <div class="px-4 py-3 border-b border-white/10 flex gap-2 overflow-x-auto no-scrollbar" id="bookmarks-list">
            <!-- Bookmarks injected here -->
        </div>

        <!-- Vertical Tabs Area -->
        <div class="flex-1 overflow-y-auto p-3 space-y-2 no-scrollbar" id="tab-bar">
            <!-- Tabs will be injected here -->
        </div>

        <!-- Bottom Actions (New Tab, Settings, etc) -->
        <div class="p-4 border-t border-white/10 space-y-2">
            <button onclick="addNewTab()" class="w-full py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-sm font-medium flex items-center justify-center gap-2 transition-colors border border-white/5">
                <i class="fas fa-plus text-purple-400"></i> New Space
            </button>
            <div class="flex justify-between mt-2 pt-2">
                <button class="w-10 h-10 rounded-xl glass-button flex items-center justify-center text-gray-400 hover:text-white" onclick="showHistory()" title="History">
                    <i class="fas fa-history"></i>
                </button>
                <button class="w-10 h-10 rounded-xl glass-button flex items-center justify-center text-gray-400 hover:text-white" onclick="openSettings()" title="Settings">
                    <i class="fas fa-cog"></i>
                </button>
                <button class="w-10 h-10 rounded-xl glass-button flex items-center justify-center text-gray-400 hover:text-white" onclick="toggleFullscreen()" title="Fullscreen">
                    <i class="fas fa-expand"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main id="viewport-container">
        
        <!-- Floating Command Bar (Omnibox) -->
        <div class="omnibox glass-panel rounded-2xl flex items-center p-1.5 shadow-2xl backdrop-blur-3xl bg-gray-900/80">
            <!-- Nav Controls -->
            <div class="flex items-center gap-1 px-2">
                <button id="btn-back" onclick="navigateBack()" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-300 hover:bg-white/10 hover:text-white disabled:opacity-30 disabled:hover:bg-transparent transition-all">
                    <i class="fas fa-chevron-left text-sm"></i>
                </button>
                <button id="btn-forward" onclick="navigateForward()" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-300 hover:bg-white/10 hover:text-white disabled:opacity-30 disabled:hover:bg-transparent transition-all">
                    <i class="fas fa-chevron-right text-sm"></i>
                </button>
                <button id="btn-reload" onclick="reloadPage()" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-300 hover:bg-white/10 hover:text-white transition-all">
                    <i class="fas fa-rotate-right text-sm"></i>
                </button>
            </div>

            <!-- Address Input -->
            <div class="flex-1 flex items-center bg-black/30 rounded-xl px-4 py-2 mx-2 border border-white/5 focus-within:border-purple-500/50 focus-within:bg-black/50 transition-all">
                <span id="security-icon" class="mr-3 text-green-400"><i class="fas fa-lock text-xs"></i></span>
                <input type="text" id="url-input" class="w-full bg-transparent border-none outline-none text-gray-100 text-sm font-medium placeholder-gray-500" placeholder="Search or enter address..." onkeydown="handleUrlKeydown(event)">
                
                <!-- Loading indicator inside input -->
                <div id="inline-loader" class="ml-2 hidden">
                    <div class="loading-ring w-4 h-4"></div>
                </div>
            </div>

            <!-- Right Controls -->
            <div class="flex items-center gap-1 px-2">
                <button class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-300 hover:bg-white/10 hover:text-white transition-all" onclick="toggleBookmarkCurrent()" title="Bookmark">
                    <i class="far fa-star text-sm" id="bookmark-icon"></i>
                </button>
            </div>
        </div>

        <!-- Loader Overlay (for the iframe area) -->
        <div id="loader-overlay">
            <div class="w-12 h-12 border-4 border-gray-200 border-t-purple-500 rounded-full animate-spin mb-4 shadow-lg"></div>
            <p class="text-gray-800 font-medium font-sans" id="loading-url">Connecting...</p>
        </div>

        <!-- Browser Engine (Iframe) -->
        <iframe id="browser-viewport" src="https://en.wikipedia.org/wiki/Main_Page" sandbox="allow-same-origin allow-scripts allow-popups allow-forms" title="Viewport"></iframe>
    </main>

    <!-- Modals (History & Settings) -->
    <div id="history-modal" class="hidden fixed inset-0 z-50 flex justify-center items-center backdrop-blur-md bg-black/60 transition-opacity">
        <div class="glass-panel w-full max-w-2xl rounded-2xl shadow-2xl flex flex-col max-h-[80vh] border border-white/10 overflow-hidden text-gray-200">
            <div class="flex justify-between items-center p-5 border-b border-white/10 bg-white/5">
                <h2 class="text-xl font-semibold flex items-center gap-3"><i class="fas fa-history text-purple-400"></i> Journey History</h2>
                <button onclick="closeModal('history-modal')" class="text-gray-400 hover:text-white transition-colors"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-5 overflow-y-auto flex-grow space-y-2 custom-scrollbar" id="history-list">
                <!-- History items go here -->
            </div>
            <div class="p-5 border-t border-white/10 bg-black/20 flex justify-end">
                <button onclick="clearHistory()" class="px-5 py-2.5 bg-red-500/20 text-red-400 hover:bg-red-500/30 rounded-xl transition-colors text-sm font-medium border border-red-500/30">Clear Data</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="hidden fixed inset-0 z-50 flex justify-center items-center backdrop-blur-md bg-black/60">
        <div class="glass-panel w-full max-w-lg rounded-2xl shadow-2xl flex flex-col max-h-[80vh] overflow-hidden text-gray-200">
            <div class="flex justify-between items-center p-5 border-b border-white/10 bg-white/5">
                <h2 class="text-xl font-semibold flex items-center gap-3"><i class="fas fa-sliders-h text-purple-400"></i> Preferences</h2>
                <button onclick="closeModal('settings-modal')" class="text-gray-400 hover:text-white transition-colors"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-6">
                <!-- Setting Item -->
                <div class="space-y-2">
                    <label class="font-medium text-white block">Startup Page</label>
                    <input type="text" id="homepage-url-setting" value="https://en.wikipedia.org" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-sm focus:border-purple-500 outline-none text-white transition-colors">
                </div>
                <!-- Setting Item -->
                <div class="space-y-2">
                    <label class="font-medium text-white block">Search Engine</label>
                    <select id="search-engine-setting" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-sm focus:border-purple-500 outline-none text-white transition-colors appearance-none">
                        <option value="duckduckgo">DuckDuckGo (Recommended for framing)</option>
                        <option value="google">Google</option>
                        <option value="bing">Bing</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script>
        const state = {
            currentZoom: 100,
            history: [], 
            historyIndex: -1, 
            bookmarks: [
                { title: 'Wiki', url: 'https://en.wikipedia.org', icon: 'https://en.wikipedia.org/favicon.ico' },
                { title: 'Duck', url: 'https://duckduckgo.com', icon: 'https://duckduckgo.com/favicon.ico' }
            ],
            settings: {
                homepage: 'https://en.wikipedia.org',
                searchEngine: 'duckduckgo'
            },
            tabs: [
                { id: 1, title: 'Welcome', url: 'https://en.wikipedia.org/wiki/Main_Page', favicon: 'https://en.wikipedia.org/favicon.ico' }
            ],
            activeTabId: 1,
            nextTabId: 2
        };

        const dom = {
            urlInput: document.getElementById('url-input'),
            iframe: document.getElementById('browser-viewport'),
            loaderOverlay: document.getElementById('loader-overlay'),
            inlineLoader: document.getElementById('inline-loader'),
            loadingUrl: document.getElementById('loading-url'),
            btnBack: document.getElementById('btn-back'),
            btnForward: document.getElementById('btn-forward'),
            btnReload: document.getElementById('btn-reload'),
            securityIcon: document.getElementById('security-icon'),
            bookmarksList: document.getElementById('bookmarks-list'),
            bookmarkIcon: document.getElementById('bookmark-icon'),
            tabBar: document.getElementById('tab-bar')
        };

        window.onload = () => {
            dom.iframe.addEventListener('load', iframeLoaded);
            dom.iframe.addEventListener('error', iframeError);
            updateHistoryUI();
            renderBookmarks();
            renderTabs();
            loadUrl(state.tabs[0].url, true);
        };

        function loadUrl(input, isInit = false) {
            if (!input) return;
            let url = input.trim();
            
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                if (url.includes('.') && !url.includes(' ')) {
                    url = 'https://' + url;
                } else {
                    url = getSearchUrl(url);
                }
            }

            dom.urlInput.value = url;
            try { dom.loadingUrl.innerText = "Connecting to " + new URL(url).hostname; } catch(e){}
            showLoading();

            if (url.startsWith('https')) {
                dom.securityIcon.innerHTML = '<i class="fas fa-lock text-xs"></i>';
                dom.securityIcon.className = 'mr-3 text-green-400';
            } else if (url.startsWith('http:')) {
                dom.securityIcon.innerHTML = '<i class="fas fa-unlock text-xs"></i>';
                dom.securityIcon.className = 'mr-3 text-red-400';
            } else {
                dom.securityIcon.innerHTML = '<i class="fas fa-info-circle text-xs"></i>';
                dom.securityIcon.className = 'mr-3 text-gray-400';
            }

            dom.iframe.src = url;

            if (!isInit) {
                if (state.historyIndex < state.history.length - 1) {
                    state.history = state.history.slice(0, state.historyIndex + 1);
                }
                if (state.history.length === 0 || state.history[state.history.length - 1].url !== url) {
                    state.history.push({ url: url, title: url, timestamp: new Date() });
                    state.historyIndex = state.history.length - 1;
                }
            } else if (state.history.length === 0) {
                 state.history.push({ url: url, title: 'Initial Page', timestamp: new Date() });
                 state.historyIndex = 0;
            }

            updateNavButtons();
            checkIfBookmarked(url);
            updateCurrentTab(url);
        }

        function handleUrlKeydown(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                loadUrl(dom.urlInput.value);
                dom.urlInput.blur();
            }
        }

        function getSearchUrl(query) {
            const engine = state.settings.searchEngine || document.getElementById('search-engine-setting').value;
            const encoded = encodeURIComponent(query);
            switch (engine) {
                case 'google': return `https://www.google.com/search?q=${encoded}`; // Note: often blocks framing
                case 'bing': return `https://www.bing.com/search?q=${encoded}`;
                case 'duckduckgo': 
                default: return `https://duckduckgo.com/?q=${encoded}`;
            }
        }

        function iframeLoaded() {
            hideLoading();
            try {
                const title = dom.iframe.contentDocument.title;
                if (title && state.history[state.historyIndex]) state.history[state.historyIndex].title = title;
            } catch (e) {
                try {
                    const parsedUrl = new URL(dom.iframe.src);
                    let hostname = parsedUrl.hostname.replace('www.', '');
                    hostname = hostname.charAt(0).toUpperCase() + hostname.slice(1);
                    if (state.history[state.historyIndex]) state.history[state.historyIndex].title = hostname;
                    updateTabVisuals(state.activeTabId, hostname, `https://${parsedUrl.hostname}/favicon.ico`);
                } catch(err) {}
            }
            updateHistoryUI();
        }

        function iframeError() {
            hideLoading();
            console.error("Iframe load failed (likely X-Frame-Options block).");
        }

        function navigateBack() {
            if (state.historyIndex > 0) {
                state.historyIndex--;
                const prevUrl = state.history[state.historyIndex].url;
                loadUrl(prevUrl, true); // true prevents adding to history stack again
            }
        }

        function navigateForward() {
            if (state.historyIndex < state.history.length - 1) {
                state.historyIndex++;
                const nextUrl = state.history[state.historyIndex].url;
                loadUrl(nextUrl, true);
            }
        }

        function reloadPage() {
            showLoading();
            const currentSrc = dom.iframe.src;
            dom.iframe.src = 'about:blank';
            setTimeout(() => { dom.iframe.src = currentSrc; }, 50);
        }

        function updateNavButtons() {
            dom.btnBack.disabled = state.historyIndex <= 0;
            dom.btnForward.disabled = state.historyIndex >= state.history.length - 1;
        }

        function showLoading() {
            dom.loaderOverlay.classList.add('active');
            dom.inlineLoader.classList.remove('hidden');
            dom.btnReload.innerHTML = '<i class="fas fa-times text-sm text-red-400"></i>';
            dom.btnReload.onclick = stopLoading;
        }

        function hideLoading() {
            dom.loaderOverlay.classList.remove('active');
            dom.inlineLoader.classList.add('hidden');
            dom.btnReload.innerHTML = '<i class="fas fa-rotate-right text-sm"></i>';
            dom.btnReload.onclick = reloadPage;
        }

        function stopLoading() {
            hideLoading();
            dom.iframe.src = dom.urlInput.value; 
        }

        function openSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('homepage-url-setting').value = state.settings.homepage;
            document.getElementById('search-engine-setting').value = state.settings.searchEngine;
        }

        function showHistory() {
            updateHistoryUI();
            document.getElementById('history-modal').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                const fullscreenPromise = document.documentElement.requestFullscreen();
                if (fullscreenPromise !== undefined) {
                    fullscreenPromise.catch(err => {
                        console.warn("Fullscreen API is restricted in this environment.", err);
                        // In a real app, you might show a custom notification toast here
                    });
                }
            }
            else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        function toggleBookmarkCurrent() {
            const currentUrl = dom.urlInput.value;
            const existingIndex = state.bookmarks.findIndex(b => b.url === currentUrl);
            
            if (existingIndex > -1) {
                state.bookmarks.splice(existingIndex, 1);
                dom.bookmarkIcon.classList.replace('fas', 'far');
                dom.bookmarkIcon.classList.replace('text-purple-400', 'text-gray-300');
            } else {
                let title = "Bookmark";
                try { title = new URL(currentUrl).hostname.replace('www.', ''); } catch(e) {}
                state.bookmarks.push({ title, url: currentUrl, icon: `https://${new URL(currentUrl).hostname}/favicon.ico` });
                dom.bookmarkIcon.classList.replace('far', 'fas');
                dom.bookmarkIcon.classList.replace('text-gray-300', 'text-purple-400');
            }
            renderBookmarks();
        }

        function checkIfBookmarked(url) {
            const isBookmarked = state.bookmarks.some(b => b.url === url);
            if (isBookmarked) {
                dom.bookmarkIcon.classList.replace('far', 'fas');
                dom.bookmarkIcon.classList.replace('text-gray-300', 'text-purple-400');
            } else {
                dom.bookmarkIcon.classList.replace('fas', 'far');
                dom.bookmarkIcon.classList.replace('text-purple-400', 'text-gray-300');
            }
        }

        function renderBookmarks() {
            dom.bookmarksList.innerHTML = '';
            state.bookmarks.forEach(bm => {
                const btn = document.createElement('button');
                btn.className = "flex-shrink-0 w-8 h-8 rounded-lg glass-button bg-white/5 flex items-center justify-center border border-white/5";
                btn.onclick = () => loadUrl(bm.url);
                btn.title = bm.title;
                
                const img = document.createElement('img');
                img.src = bm.icon;
                img.className = "w-4 h-4 rounded-sm";
                img.onerror = function() {
                    this.style.display = 'none';
                    this.nextElementSibling.style.display = 'block';
                };
                
                const icon = document.createElement('i');
                icon.className = "fas fa-globe text-gray-400 text-xs hidden";

                btn.appendChild(img);
                btn.appendChild(icon);
                dom.bookmarksList.appendChild(btn);
            });
        }

        function updateHistoryUI() {
            const list = document.getElementById('history-list');
            if (state.history.length === 0) {
                list.innerHTML = '<p class="text-gray-500 text-center py-8">No browsing history yet.</p>';
                return;
            }
            list.innerHTML = '';
            [...state.history].reverse().forEach((item, i) => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 cursor-pointer group transition-colors";
                div.onclick = (e) => {
                    if (!e.target.closest('button')) { loadUrl(item.url); closeModal('history-modal'); }
                };
                const timeStr = item.timestamp ? new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                let domain = ''; try { domain = new URL(item.url).hostname; } catch(e) {}

                div.innerHTML = `
                    <div class="flex items-center gap-4 overflow-hidden">
                        <span class="text-xs text-gray-500 w-12">${timeStr}</span>
                        <img src="https://${domain}/favicon.ico" class="w-5 h-5 rounded-sm bg-white/10" onerror="this.style.display='none'">
                        <div class="flex flex-col overflow-hidden">
                            <span class="text-sm font-medium text-gray-200 truncate">${item.title}</span>
                            <span class="text-xs text-gray-500 truncate">${item.url}</span>
                        </div>
                    </div>
                    <button class="opacity-0 group-hover:opacity-100 p-2 text-gray-500 hover:text-red-400 transition-all" onclick="removeFromHistory(${state.history.length - 1 - i}, event)">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        function removeFromHistory(index, event) {
            event.stopPropagation();
            state.history.splice(index, 1);
            if (state.historyIndex >= index) Math.max(0, state.historyIndex - 1);
            updateHistoryUI();
        }

        function clearHistory() {
            state.history = []; state.historyIndex = -1;
            updateHistoryUI(); updateNavButtons();
        }

        function addNewTab() {
            const newId = state.nextTabId++;
            state.tabs.push({ id: newId, title: 'New Space', url: state.settings.homepage, favicon: 'https://duckduckgo.com/favicon.ico' });
            renderTabs();
            switchTab(newId);
            setTimeout(() => { dom.urlInput.focus(); dom.urlInput.select(); }, 100);
        }

        function renderTabs() {
            dom.tabBar.innerHTML = '';
            state.tabs.forEach(tab => {
                const isActive = tab.id === state.activeTabId;
                const tabDiv = document.createElement('div');
                tabDiv.className = `v-tab flex items-center justify-between p-2.5 rounded-xl cursor-pointer group ${isActive ? 'active' : 'hover:bg-white/5 text-gray-400'}`;
                tabDiv.onclick = (e) => { if(!e.target.closest('button')) switchTab(tab.id); };
                
                const contentDiv = document.createElement('div');
                contentDiv.className = "flex items-center gap-3 overflow-hidden";
                
                const img = document.createElement('img');
                img.src = tab.favicon;
                img.className = "w-5 h-5 rounded bg-white/10 p-0.5";
                img.onerror = function() { this.src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90" fill="white">📄</text></svg>'; };
                
                const titleSpan = document.createElement('span');
                titleSpan.className = `truncate text-sm ${isActive ? 'text-white font-medium' : ''}`;
                titleSpan.innerText = tab.title || "New Space";

                contentDiv.appendChild(img);
                contentDiv.appendChild(titleSpan);

                const closeBtn = document.createElement('button');
                closeBtn.className = `w-6 h-6 flex items-center justify-center rounded-lg transition-all ${isActive ? 'text-gray-300 hover:bg-white/10 hover:text-white' : 'opacity-0 group-hover:opacity-100 text-gray-500 hover:bg-white/10 hover:text-white'}`;
                closeBtn.innerHTML = '<i class="fas fa-times text-xs"></i>';
                closeBtn.onclick = (e) => { e.stopPropagation(); closeTab(tab.id); };

                tabDiv.appendChild(contentDiv);
                tabDiv.appendChild(closeBtn);
                dom.tabBar.appendChild(tabDiv);
            });
        }

        function switchTab(id) {
            if (state.activeTabId === id) return;
            const prevTab = state.tabs.find(t => t.id === state.activeTabId);
            if(prevTab) prevTab.url = dom.urlInput.value; 

            state.activeTabId = id;
            const newTab = state.tabs.find(t => t.id === id);
            if(newTab) {
                dom.urlInput.value = newTab.url;
                dom.iframe.src = newTab.url;
                checkIfBookmarked(newTab.url);
            }
            renderTabs();
        }

        function closeTab(id) {
            if (state.tabs.length <= 1) { loadUrl(state.settings.homepage); return; }
            const index = state.tabs.findIndex(t => t.id === id);
            state.tabs.splice(index, 1);
            if (state.activeTabId === id) {
                switchTab(state.tabs[Math.max(0, index - 1)].id);
            } else { renderTabs(); }
        }

        function updateCurrentTab(url) {
            const tab = state.tabs.find(t => t.id === state.activeTabId);
            if(tab) {
                tab.url = url;
                try {
                     const parsed = new URL(url);
                     let hostname = parsed.hostname.replace('www.', '');
                     tab.title = hostname.charAt(0).toUpperCase() + hostname.slice(1);
                     tab.favicon = `https://${parsed.hostname}/favicon.ico`;
                     renderTabs();
                } catch(e) {}
            }
        }

        function updateTabVisuals(id, title, faviconUrl) {
            const tab = state.tabs.find(t => t.id === id);
            if (tab) {
                if(title) tab.title = title;
                if(faviconUrl) tab.favicon = faviconUrl;
                renderTabs();
            }
        }

        document.getElementById('homepage-url-setting').addEventListener('change', e => state.settings.homepage = e.target.value);
        document.getElementById('search-engine-setting').addEventListener('change', e => state.settings.searchEngine = e.target.value);

    </script>
</body>
</html>
