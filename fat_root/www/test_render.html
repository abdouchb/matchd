<!DOCTYPE html>
<html>
<head>
<style>
body {
    background-color: #f0f0f0;
    color: #333;
    margin: 0;
    padding: 20px;
}
.header {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 20px;
    color: #4CAF50;
}
.flex-container {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background-color: #fff;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #ddd;
    margin-bottom: 20px;
}
.flex-item {
    background-color: #2196F3;
    color: white;
    padding: 10px 20px;
    border-radius: 6px;
}
.profile-pic {
    width: 100px;
    height: 100px;
    border-radius: 50px;
    border: 2px solid #2196F3;
}
.grid-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background-color: #fff;
    padding: 20px;
    border-radius: 12px;
}
</style>
</head>
<body>

<div class="header">ZarqaaKit Next-Gen Renderer</div>

<div class="flex-container">
    <div class="flex-item">Flex Item 1</div>
    <div class="flex-item">Flex Item 2</div>
    <img src="test.png" class="profile-pic" />
</div>

<div class="grid-container">
    <div style="background-color: #ff9800; padding: 15px; color: white; border-radius: 4px;">Column Flex 1</div>
    <div style="background-color: #f44336; padding: 15px; color: white; border-radius: 4px; justify-content: center; display: flex;">
        Centered Text in Column
    </div>
</div>

</body>
</html>
