# Zarqaa OS 0.1 - Limine Bootloader Configuration
# Creator: Abdelhak Chabbi
#
# This file configures the Limine bootloader. It is placed in the
# root of the ISO image and tells Limine how to load our kernel.

# Boot menu timeout (seconds). Set to 0 for instant boot.
timeout: 3
term_background: boot():/boot/boot_bg.png
term_background_style: stretched

/Zarqaa OS 0.1 - by Abdelhak Chabbi
    protocol: limine
    kernel_path: boot():/boot/zarqaaos.elf
    module_path: boot():/boot/initrd.tar
    resolution: 1280x720x32
